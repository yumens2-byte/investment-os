name: Naver Blog Compatibility CI

# CI-only verification workflow; production watchdog monitoring is intentionally excluded.
on:
  pull_request:
    paths:
      - "blog/**"
      - "blog_main.py"
      - "main.py"
      - "tests/test_naver_blog_*.py"
      - ".github/workflows/blog_phase0_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DRY_RUN: "true"
  LOG_LEVEL: "WARNING"
  FRED_API_KEY: "test"
  X_API_KEY: "test"
  X_API_SECRET: "test"
  X_ACCESS_TOKEN: "test"
  X_ACCESS_TOKEN_SECRET: "test"
  TG_BOT_TOKEN: "test"
  TG_CHANNEL_ID_FREE: "test"
  TG_CHANNEL_ID_PAID: "test"
  SUPABASE_URL: "https://test.supabase.co"
  SUPABASE_ANON_KEY: "test"
  MPLBACKEND: "Agg"

jobs:
  blog-isolation:
    name: Blog unit and isolation guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -r requirements.txt
      - name: Blog unit and cross-pipeline isolation tests
        run: |
          python -m pytest -q             tests/test_naver_blog_phase0.py             tests/test_naver_blog_compatibility.py
      - name: Existing main entrypoint must match PR base
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          git diff --exit-code "origin/$GITHUB_BASE_REF" -- main.py
      - name: Both CLI entrypoints load independently
        run: |
          python main.py --help
          python blog_main.py --help

  repository-regression:
    name: Entire maintained pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -r requirements.txt
      - name: Run every maintained pytest test
        id: maintained
        continue-on-error: true
        run: python -m pytest -q tests
      - name: Record inherited pytest debt
        if: ${{ always() }}
        run: |
          echo "maintained-suite=${{ steps.maintained.outcome }}"
          echo "Pass/fail equivalence against main is enforced by the baseline comparison job."

  baseline-compatibility:
    name: Main versus PR full compatibility comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Install shared test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -r candidate/requirements.txt
      - name: Compare every maintained existing pytest test
        run: |
          set +e
          (
            cd baseline
            python -m pytest -q tests
          ) > /tmp/baseline-pytest.log 2>&1
          baseline_rc=$?
          (
            cd candidate
            python -m pytest -q tests               --ignore=tests/test_naver_blog_phase0.py               --ignore=tests/test_naver_blog_compatibility.py
          ) > /tmp/candidate-pytest.log 2>&1
          candidate_rc=$?
          set -e
          tail -n 5 /tmp/baseline-pytest.log
          tail -n 5 /tmp/candidate-pytest.log
          test "$baseline_rc" -eq "$candidate_rc"
      - name: Compare all legacy exhaustive scripts
        run: |
          scripts="full_test.py test_tier1_signals.py test_tier2_signals.py test_e2e_pipeline.py"
          for script in $scripts; do
            set +e
            (
              cd baseline
              python "$script"
            ) > "/tmp/baseline-$script.log" 2>&1
            baseline_rc=$?
            (
              cd candidate
              python "$script"
            ) > "/tmp/candidate-$script.log" 2>&1
            candidate_rc=$?
            set -e

            echo "=== $script: baseline=$baseline_rc candidate=$candidate_rc ==="
            grep -E "전수 테스트 결과:|테스트 결과:|📊 결과:|Round [12]:"               "/tmp/baseline-$script.log" | tail -n 4 || true
            grep -E "전수 테스트 결과:|테스트 결과:|📊 결과:|Round [12]:"               "/tmp/candidate-$script.log" | tail -n 4 || true
            test "$baseline_rc" -eq "$candidate_rc"
          done
      - name: Compare existing pilot CLI
        run: |
          set +e
          (
            cd baseline
            python main.py test
          ) > /tmp/baseline-pilot.log 2>&1
          baseline_rc=$?
          (
            cd candidate
            python main.py test
          ) > /tmp/candidate-pilot.log 2>&1
          candidate_rc=$?
          set -e
          tail -n 10 /tmp/baseline-pilot.log
          tail -n 10 /tmp/candidate-pilot.log
          test "$baseline_rc" -eq "$candidate_rc"
