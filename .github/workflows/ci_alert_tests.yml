name: Alert Regression Tests

# ─────────────────────────────────────────────────────────────────────
# Investment OS — Alert 시스템 회귀 테스트 자동화
#
# 트리거:
#   - PR / push: alert 관련 파일 변경 시
#   - workflow_dispatch: 수동 실행
#
# 검증 범위:
#   1. test_alert_unit_boundaries.py     — 16종 alert 임계값 boundary (114 케이스)
#   2. test_alert_integration_full.py    — run_alert_engine 통합 (45 케이스)
#   3. test_alert_policy_matrix.py       — 정책 docstring ↔ 코드 동기화 (84 케이스)
#   4. test_b21a_x_image_guard.py        — BUGFIX-2026-05-14 단위 (53 케이스)
#   5. test_b21a_integration_sim.py      — BUGFIX-2026-05-14 통합 (55 케이스)
#
# 하나라도 실패 시 workflow 전체 실패 → PR 머지 차단.
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'gen/nuna_weekly/**'
      - 'engines/alert_engine.py'
      - 'run_alert.py'
      - 'config/settings.py'
      - 'tests/test_alert_**.py'
      - 'tests/test_b21a_**.py'
      - '.github/workflows/ci_alert_tests.yml'
      - '.github/workflows/*.yml'
      - 'weekend/comic_novel*.py'
      - 'db/comic_novel*.py'
      - 'db/daily_store.py'
      - 'tests/test_comic_novel*.py'
      - 'scripts/verify_comic_novel_deployment.py'
      - 'supabase/functions/comic-novel-gateway/**'
      - 'tests/test_comic_novel_gateway*.mjs'
      - 'tests/test_watchdog_workflow.py'
      - 'tests/test_workflow_operations.py'
      - 'tests/test_morning_watchdog.py'
      - 'core/morning_watchdog.py'
  push:
    branches: [main]
    paths:
      - 'gen/nuna_weekly/**'
      - 'engines/alert_engine.py'
      - 'run_alert.py'
      - 'config/settings.py'
      - '.github/workflows/*.yml'
      - 'weekend/comic_novel*.py'
      - 'db/comic_novel*.py'
      - 'db/daily_store.py'
      - 'tests/test_comic_novel*.py'
      - 'scripts/verify_comic_novel_deployment.py'
      - 'supabase/functions/comic-novel-gateway/**'
      - 'tests/test_comic_novel_gateway*.mjs'
      - 'tests/test_watchdog_workflow.py'
      - 'tests/test_workflow_operations.py'
      - 'tests/test_morning_watchdog.py'
      - 'core/morning_watchdog.py'
  workflow_dispatch:

jobs:
  nuna-dbcheck:
    name: NUNA configured DB key (read-only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: nuna-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install DB HTTP client
        run: python -m pip install requests==2.32.3
      - name: Check configured Supabase key without writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import json
          import logging
          import sys
          from gen.nuna_weekly import db, secret_env
          secret_env.setup_logging()
          try:
              result = db.RestStore().check_access()
          except Exception as exc:
              logging.error('NUNA_DB_CHECK_FAILED: %s', secret_env.redact(str(exc), 500))
              sys.exit(1)
          logging.info('DB_CHECK_PASSED (read-only): %s', json.dumps(result, ensure_ascii=False))
          PY

  nuna-regression:
    name: NUNA weekly regression (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install video test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Install pinned Python dependencies
        run: python -m pip install -r gen/nuna_weekly/requirements.txt
      - name: NUNA isolated regression tests (no production secrets)
        run: python -m pytest gen/nuna_weekly/tests -q

  workflow-guardrails:
    name: Workflow 운영 가드레일
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Watchdog 및 운영 정책 회귀 테스트
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_watchdog_workflow.py tests/test_workflow_operations.py tests/test_morning_watchdog.py

      - name: GitHub Actions 정적 검사
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7

  alert-regression:
    name: Alert 16종 회귀 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # ── 더미 환경변수 (테스트 모듈 import 시 config.settings 로드용) ──
    # 실제 API 호출 없음, DRY_RUN=true 강제
    env:
      DRY_RUN: 'true'
      LOG_LEVEL: 'WARNING'
      FRED_API_KEY: 'test'
      X_API_KEY: 'test'
      X_API_SECRET: 'test'
      X_ACCESS_TOKEN: 'test'
      X_ACCESS_TOKEN_SECRET: 'test'
      TG_BOT_TOKEN: 'test'
      TG_CHANNEL_ID_FREE: 'test'
      TG_CHANNEL_ID_PAID: 'test'
      SUPABASE_URL: 'https://test.supabase.co'
      SUPABASE_ANON_KEY: 'test'

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치 (테스트 최소 dep만)
        run: |
          python -m pip install --upgrade pip
          # 테스트가 import하는 모듈만: alert_engine, config.settings, run_alert._is_x_cooldown_active
          # → python-dotenv, supabase, tweepy 등 dep 일부 필요
          pip install -r requirements.txt

      - name: TR-A — 단위 임계값 테스트 (114 케이스)
        id: tr_a
        run: python tests/test_alert_unit_boundaries.py

      - name: TR-B — 통합 시나리오 테스트 (45 케이스)
        id: tr_b
        if: ${{ always() && steps.tr_a.outcome != 'cancelled' }}
        run: python tests/test_alert_integration_full.py

      - name: TR-C — 정책 매트릭스 테스트 (84 케이스)
        id: tr_c
        if: ${{ always() && steps.tr_a.outcome != 'cancelled' }}
        run: python tests/test_alert_policy_matrix.py

      - name: BUGFIX-2026-05-14 단위 (53 케이스)
        id: bugfix_unit
        if: ${{ always() && steps.tr_a.outcome != 'cancelled' }}
        run: python tests/test_b21a_x_image_guard.py

      - name: BUGFIX-2026-05-14 통합 (55 케이스)
        id: bugfix_integ
        if: ${{ always() && steps.tr_a.outcome != 'cancelled' }}
        run: python tests/test_b21a_integration_sim.py

      - name: 종합 결과 요약
        if: ${{ always() }}
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "Alert 회귀 테스트 결과 요약 (총 351 케이스)"
          echo "════════════════════════════════════════════════════════"
          echo "TR-A 단위 임계값            : ${{ steps.tr_a.outcome }}"
          echo "TR-B 통합 시나리오          : ${{ steps.tr_b.outcome }}"
          echo "TR-C 정책 매트릭스          : ${{ steps.tr_c.outcome }}"
          echo "BUGFIX-2026-05-14 단위      : ${{ steps.bugfix_unit.outcome }}"
          echo "BUGFIX-2026-05-14 통합      : ${{ steps.bugfix_integ.outcome }}"
          echo "════════════════════════════════════════════════════════"

  comic-novel-regression:
    permissions:
      contents: read
      id-token: write
    name: Comic Novel Python 3.11 regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest PyYAML==6.0.3 requests==2.32.3 python-dotenv==1.0.1 supabase==2.10.0
      - run: >-
          python -m pytest -q
          tests/test_comic_novel_fb.py tests/test_facebook_publisher.py
          tests/test_comic_novel_channel_store.py tests/test_comic_novel_gateway.py tests/test_weekend_comic_novel.py
          tests/test_comic_novel_x_confirmation.py tests/test_character_vote.py
          tests/test_daily_store_contract.py tests/test_workflow_operations.py
          tests/test_publish_channel.py tests/test_watchdog_workflow.py
          tests/test_morning_watchdog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GitHub OIDC gateway security tests
        run: node --test tests/test_comic_novel_gateway*.mjs
      - name: Read-only production deployment check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NOVEL_USE_GITHUB_OIDC: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
          DRY_RUN: 'true'
        run: python -m scripts.verify_comic_novel_deployment
