# =============================================================================
# Std Check — EDT 개발 표준 정적 검사 (CI)  VERSION 1.0.0
#
# 규약 정본: Notion 「EDT 개발 표준 정본 (Standards Register)」
# 검사기: tools/std_check.py  ·  baseline: .std/baseline.json  ·  등록 이름: .std/registered_names.txt
# 판정: baseline 에 없는 '오류'가 1건이라도 있으면 실패. 경고는 실패시키지 않는다.
# 스케줄 없음(cron↔if 매핑 해당 없음). CI 워크플로라 notify_watchdog 감시 대상에서 제외한다.
# =============================================================================
name: Std Check

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  std-check:
    name: 개발 표준 정적 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 검사기 의존성 설치
        run: python -m pip install 'PyYAML>=6.0' 'pytest>=8,<10'

      - name: 검사기 회귀 테스트
        run: python -m pytest -q tests/test_std_check.py

      - name: 표준 정적 검사 (baseline 비교)
        run: python tools/std_check.py --verbose
