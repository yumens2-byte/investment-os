# Deployment approved; GitHub OIDC read-only production verification passed.
name: 🌐 Comic Novel Facebook (Friday)

on:
  schedule:
    - cron: '17 13 * * 5' # Friday 22:17 KST
  workflow_dispatch:
    inputs:
      stage:
        description: 'Preview, Friday publish, or operator-confirmed reconciliation'
        type: choice
        options: [preview, publish, reconcile]
        default: preview
      dry_run:
        description: 'Preview only; publish/reconcile require false'
        type: boolean
        default: true

      claim_id:
        description: 'Reconcile: existing claim ID'
        type: string
      post_id:
        description: 'Reconcile: verified Facebook post ID'
        type: string
      confirmed_at:
        description: 'Reconcile: actual publication ISO timestamp with timezone'
        type: string
      note:
        description: 'Reconcile: operator verification evidence'
        type: string
      not_posted:
        description: 'Reconcile: operator confirmed no Facebook post exists'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: comic-novel-facebook
  cancel-in-progress: false

env:
  NOVEL_USE_GITHUB_OIDC: 'true'
  FACE_NOVEL_ENABLED: ${{ vars.FACE_NOVEL_ENABLED || 'true' }}
  FACE_NOVEL_FIRST_DATE: '2026-10-16'
  # Operational limit, not a Meta API maximum.
  FACE_NOVEL_MAX_CHARS: '10000'
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
  REQUEST_STAGE: ${{ github.event_name == 'schedule' && 'publish' || inputs.stage || 'preview' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
  FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}

jobs:
  comic-novel-facebook:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Random delay (scheduled)
        if: github.event_name == 'schedule' && env.FACE_NOVEL_ENABLED == 'true'
        run: |
          DELAY=$((RANDOM % 200))
          sleep "$DELAY"
      - name: Consume or reconcile one stored novel
        env:
          RECONCILE_CLAIM_ID: ${{ inputs.claim_id }}
          RECONCILE_POST_ID: ${{ inputs.post_id }}
          RECONCILE_CONFIRMED_AT: ${{ inputs.confirmed_at }}
          RECONCILE_NOTE: ${{ inputs.note }}
          RECONCILE_NOT_POSTED: ${{ inputs.not_posted }}
          RECONCILE_ACTOR: ${{ github.actor }}
        run: |
          args=(--stage "$REQUEST_STAGE" --output output/comic-novel-fb-report.json)
          if [[ "$REQUEST_STAGE" == 'reconcile' ]]; then
            if [[ "$DRY_RUN" != 'false' ]]; then
              echo "Reconciliation requires dry_run=false and verified operator evidence"
              exit 1
            fi
            args+=(--claim-id "$RECONCILE_CLAIM_ID" --actor "$RECONCILE_ACTOR" --note "$RECONCILE_NOTE")
            if [[ "$RECONCILE_NOT_POSTED" == 'true' ]]; then
              args+=(--not-posted)
            else
              args+=(--post-id "$RECONCILE_POST_ID" --confirmed-at "$RECONCILE_CONFIRMED_AT")
            fi
          fi
          python -m weekend.comic_novel_fb "${args[@]}"
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-novel-facebook-${{ github.run_id }}
          path: output/comic-novel-fb-report.json
          if-no-files-found: warn
