# Facebook job of comic_novel.yml (Sunday, parallel with X). Reusable only: run it through
# comic_novel.yml (target=facebook). The gateway authorizes FB writes by this file's
# job_workflow_ref, so the X job of the caller cannot perform them.
name: 🌐 Comic Novel Facebook (reusable)

on:
  workflow_call:
    inputs:
      stage:
        description: 'preview | publish | reconcile'
        type: string
        default: preview
      dry_run:
        description: "'true' = preview only; publish/reconcile require 'false'"
        type: string
        default: 'true'
      claim_id:
        type: string
        default: ''
      post_id:
        type: string
        default: ''
      confirmed_at:
        type: string
        default: ''
      note:
        type: string
        default: ''
      not_posted:
        type: string
        default: 'false'
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true
      FACE_PAGE_ID:
        required: true
      FACE_PAGE_TOKEN:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_FREE_CHANNEL_ID:
        required: false

jobs:
  comic-novel-facebook:
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: comic-novel-facebook
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOVEL_USE_GITHUB_OIDC: 'true'
      FACE_NOVEL_ENABLED: ${{ vars.FACE_NOVEL_ENABLED || 'true' }}
      FACE_NOVEL_FIRST_DATE: '2026-11-01'
      # Operational limit, not a Meta API maximum.
      FACE_NOVEL_MAX_CHARS: '10000'
      DRY_RUN: ${{ inputs.dry_run == 'false' && 'false' || 'true' }}
      REQUEST_STAGE: ${{ inputs.stage }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
      FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Random delay (scheduled)
        if: github.event_name == 'schedule' && env.FACE_NOVEL_ENABLED == 'true'
        run: |
          DELAY=$((RANDOM % 200))
          sleep "$DELAY"
      - name: Consume or reconcile one stored novel
        env:
          RECONCILE_CLAIM_ID: ${{ inputs.claim_id }}
          RECONCILE_POST_ID: ${{ inputs.post_id }}
          RECONCILE_CONFIRMED_AT: ${{ inputs.confirmed_at }}
          RECONCILE_NOTE: ${{ inputs.note }}
          RECONCILE_NOT_POSTED: ${{ inputs.not_posted }}
          RECONCILE_ACTOR: ${{ github.actor }}
        run: |
          case "$REQUEST_STAGE" in preview|publish|reconcile) ;; *) echo "Invalid stage: $REQUEST_STAGE"; exit 1 ;; esac
          args=(--stage "$REQUEST_STAGE" --output output/comic-novel-fb-report.json)
          if [[ "$REQUEST_STAGE" == 'reconcile' ]]; then
            if [[ "$DRY_RUN" != 'false' ]]; then
              echo "Reconciliation requires dry_run=false and verified operator evidence"
              exit 1
            fi
            args+=(--claim-id "$RECONCILE_CLAIM_ID" --actor "$RECONCILE_ACTOR" --note "$RECONCILE_NOTE")
            if [[ "$RECONCILE_NOT_POSTED" == 'true' ]]; then
              args+=(--not-posted)
            else
              args+=(--post-id "$RECONCILE_POST_ID" --confirmed-at "$RECONCILE_CONFIRMED_AT")
            fi
          fi
          python -m weekend.comic_novel_fb "${args[@]}"
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-novel-facebook-${{ github.run_id }}
          path: output/comic-novel-fb-report.json
          if-no-files-found: warn
