name: ⚠️ EDT Snapshot Watchdog

# ============================================================
# EDT Universe — 스냅샷 가용성 감시 + 자동 실행요청 워크플로 v1.1
# 신설: 2026-09-26 (마스터 승인 — A안)
# 개정: 2026-09-26 (마스터 승인 "W-1 승인") — 크론 요일 정렬
# ============================================================
#
# [v1.1 변경 — W-1 크론 요일 정렬]
#   변경 전: cron '15 0 * * 1-5'  → UTC 월~금 = KST **월~금** 09:15
#   변경 후: cron '15 0 * * 2-6'  → UTC 화~토 = KST **화~토** 09:15
#
#   사유(실측): 수집기 edt_snapshot.yml 의 크론은 '40 21 * * 1-5'
#     → UTC 월~금 = KST **화~토** 06:40 이다.
#     v1.0 의 크론은 KST 월~금 이 되어 수집기와 **요일이 하루 어긋났다.**
#     결과: 토요일 회차에서 수집기는 발화하나 watchdog 는 미발화 →
#           안전망 공백. 2026-09-26(토)이 그 실사례였다.
#     또한 RULE PUB-06 확정 근거였던 실효 실행 실측 9회가 전부
#     KST 화~토 구간이었으므로, 정렬 대상은 화~토가 맞다.
#
#   ⚠️ 크론의 요일 필드는 **UTC 기준**이다. KST 발화 요일을 얻으려면
#      UTC 요일 +1 (00:15 UTC 는 KST 동일일 09:15 이므로 요일이 넘어간다).
#      → 수집기와 동일하게 UTC 화~토 지정은 잘못이며, UTC 화~토(2-6)가
#        KST 화~토 발화를 만든다. 본 개정은 그 계산에 따른다.
# ============================================================
#
# [목적]
#   1차 예약분(21:40 UTC)의 GitHub Actions 지연·드롭 시,
#   KST 화~토 09:15 시점에 스냅샷 가용성을 **실측 판정**하고,
#   미달이면 edt_snapshot.yml 을 workflow_dispatch 로 즉시 실행요청한다.
#
# [근거 — 상위 규정]
#   · 17 v1.12 RULE PUB-06 — CP-1 은 KST 09:30 이후 실행. 실효 SLA 09:25.
#   · 17 v1.12 RULE PUB-07 — 가용 시각 미도달 시 [AVAILABILITY GAP] + 3옵션.
#     본 워크플로의 판정 기준은 PUB-07 STEP 2 의 (a)(b)(c) 를 **그대로 승계**한다.
#     동 규정 (b) 옵션 ①(재시도)을 선제 자동화한 것이며,
#     watchdog 이 실패하거나 부재하면 PUB-07 3옵션은 CP-1 단계에서
#     종전대로 상신된다 — **대체가 아니라 보완**이다.
#   · TRACK-A2-32 / A2-37 후속 — 스케줄 지연 자체는 저장소 코드로 제거 불가.
#     잔여 위험은 "당일 미생성"이며, 본 워크플로가 그 위험만 흡수한다.
#
# [실측 근거 — 2026-09-25 조사]
#   · 명목 21:40 UTC → 실효 시작 23:56~23:59 UTC (약 2시간 16분 지연)
#   · 명목 정시 실행 0/9회
#   · workflow_dispatch 는 지정 ref 의 **최신** 워크플로 정의를 사용한다
#     → 파일 업로드 직후의 예약분이 구 정의를 물고 실행되는 문제까지 함께 완화.
#
# [권한]
#   permissions.actions = write — GITHUB_TOKEN 으로 dispatch 발동.
#   GitHub 은 2022-09-08 부터 GITHUB_TOKEN 의 workflow_dispatch /
#   repository_dispatch 발동을 허용한다(통상 이벤트 재귀 차단의 명시적 예외).
#
# [비용]
#   신규 Secrets **불요** — NOTION_API_KEY / EDT_SNAPSHOT_PAGE_ID 재사용.
#   기존 edt_snapshot.yml / edt/edt_snapshot.py **무접촉**.
#
# [알려진 트레이드오프]
#   KST 화~토 09:15 판정 시점에 예약분이 아직 실행 중이면 판정 (b)로 떨어져
#   dispatch 가 발생할 수 있다. → dispatch 직전 in-flight 조회로 억제하고,
#   그래도 겹치면 edt_snapshot.yml 의 concurrency group('edt-snapshot')이
#   직렬화하므로 중복 기록은 발생하지 않는다(동일 데이터 재기록만 발생).
# ============================================================

on:
  schedule:
    - cron: '15 0 * * 2-6'      # UTC 화~토 00:15 = KST 화~토 09:15
                                 # ⚠️ v1.1 W-1 — 수집기('40 21 * * 1-5'
                                 #    = KST 화~토)와 요일 정렬. UTC 요일
                                 #    기준이므로 KST 발화 요일 = UTC 요일과 동일
                                 #    (00:15 UTC → 09:15 KST, 같은 날짜)
  workflow_dispatch:            # 수동 점검용 (운영 필수 경로 아님)

permissions:
  actions: write                # dispatch 발동 + 실행목록 조회
  contents: read

concurrency:
  group: edt-snapshot-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Snapshot availability watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # ------------------------------------------------------------
      # 판정 — 17 v1.12 RULE PUB-07 STEP 2 (a)(b)(c) 승계
      # ------------------------------------------------------------
      - name: Snapshot availability check
        id: check
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          EDT_SNAPSHOT_PAGE_ID: ${{ secrets.EDT_SNAPSHOT_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          API = os.environ.get("NOTION_API_KEY", "")
          PAGE = os.environ.get("EDT_SNAPSHOT_PAGE_ID", "")
          OUT = os.environ.get("GITHUB_OUTPUT", "")

          # ===== DECIDE =====
          def decide(schema, gen_kst, anchor_ok, today):
              """PUB-07 STEP 2 판정. (verdict, reason) 반환.
              verdict: OK(정상 경로) / DISPATCH(실행요청 필요)"""
              m = re.match(r"edt_snapshot_v(\d+)\.(\d+)", schema or "")
              if not m:
                  return "DISPATCH", f"schema_version 판독 불가({schema!r}) — PUB-07 (a) 불충족"
              if (int(m.group(1)), int(m.group(2))) < (1, 4):
                  return "DISPATCH", f"schema_version 미달({schema}) — PUB-07 (a) 불충족"
              if not anchor_ok:
                  return "DISPATCH", "meta.anchor.anchor_ok=false — PUB-07 (c)"
              gen_date = (gen_kst or "")[:10]
              if gen_date != today:
                  return "DISPATCH", (
                      f"generated_at_kst 날짜({gen_date or '부재'}) != 실행일({today}) "
                      f"— PUB-07 (b) 전일 실행분")
              return "OK", "당일 생성분 + v1.4 이상 + anchor_ok=true — PUB-07 (a) 정상 경로"

          # ===== MAIN =====
          def emit(verdict, reason, schema="", gen="", anchor=""):
              print(f"[VERDICT] {verdict} | {reason}")
              if OUT:
                  with open(OUT, "a", encoding="utf-8") as f:
                      f.write(f"verdict={verdict}\n")
                      f.write(f"reason={reason}\n")
                      f.write(f"schema={schema}\n")
                      f.write(f"gen_kst={gen}\n")
                      f.write(f"anchor_ok={anchor}\n")
              sys.exit(0)   # 판정 실패는 step 실패가 아니다 — dispatch 로 복구한다

          today = datetime.now(KST).date().isoformat()

          if not API or not PAGE:
              emit("DISPATCH", "secrets 미설정(NOTION_API_KEY / EDT_SNAPSHOT_PAGE_ID) — 보수적 실행요청")

          import requests
          try:
              r = requests.get(
                  f"https://api.notion.com/v1/blocks/{PAGE}/children?page_size=50",
                  headers={"Notion-Version": "2022-06-28",
                           "Authorization": f"Bearer {API}"}, timeout=30)
          except Exception as e:
              emit("DISPATCH", f"Notion 접속 예외({type(e).__name__}) — 보수적 실행요청")

          if r.status_code != 200:
              emit("DISPATCH", f"Notion 조회 실패 HTTP {r.status_code} — 보수적 실행요청")

          body = None
          for blk in r.json().get("results", []):
              if blk.get("type") == "code":
                  body = "".join(t.get("plain_text", "") for t in blk["code"]["rich_text"])
                  break

          if not body:
              emit("DISPATCH", "스냅샷 code block 부재 — 보수적 실행요청")

          try:
              snap = json.loads(body)
          except Exception as e:
              emit("DISPATCH", f"스냅샷 JSON 파싱 실패({type(e).__name__}) — 보수적 실행요청")

          meta = snap.get("meta") or {}
          schema = str(snap.get("schema_version") or "")
          gen = str(snap.get("generated_at_kst") or "")
          anchor_ok = bool((meta.get("anchor") or {}).get("anchor_ok"))

          verdict, reason = decide(schema, gen, anchor_ok, today)
          print(f"[SNAPSHOT] schema={schema} generated_at_kst={gen} anchor_ok={anchor_ok}")
          print(f"[TODAY] {today} (KST)")
          emit(verdict, reason, schema, gen, anchor_ok)
          PY

      # ------------------------------------------------------------
      # 실행요청 — in-flight 억제 후 dispatch
      # ------------------------------------------------------------
      - name: Dispatch snapshot run
        id: dispatch
        if: steps.check.outputs.verdict == 'DISPATCH'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          API="https://api.github.com/repos/${REPO}/actions/workflows/edt_snapshot.yml"
          H_AUTH="Authorization: Bearer ${GH_TOKEN}"
          H_ACC="Accept: application/vnd.github+json"
          H_VER="X-GitHub-Api-Version: 2022-11-28"

          # in-flight 조회 — 이미 실행 중/대기 중이면 dispatch 불요
          inflight=$(curl -sS -H "${H_AUTH}" -H "${H_ACC}" -H "${H_VER}" \
            "${API}/runs?per_page=10" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(1 for r in d.get('workflow_runs',[]) if r.get('status') in ('queued','in_progress','requested','waiting','pending')))" \
            2>/dev/null || echo "0")
          echo "in-flight 실행 수: ${inflight}"

          if [ "${inflight}" != "0" ]; then
            echo "::notice::이미 실행 중/대기 중인 스냅샷 실행이 있어 dispatch 를 생략합니다."
            echo "dispatched=skipped_inflight" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=$(curl -sS -o /tmp/disp.out -w "%{http_code}" -X POST \
            -H "${H_AUTH}" -H "${H_ACC}" -H "${H_VER}" \
            "${API}/dispatches" \
            -d "{\"ref\":\"${REF}\",\"inputs\":{\"dry_run\":\"false\"}}")

          echo "HTTP ${code}"
          if [ "${code}" != "204" ]; then
            echo "::error::dispatch 실패 (HTTP ${code})"
            cat /tmp/disp.out || true
            echo "dispatched=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "dispatch OK — ref=${REF}"
          echo "dispatched=ok" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 결과 요약
      # ------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## EDT Snapshot Watchdog"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 실행 시각 (KST) | $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S') |"
            echo "| 판정 | \`${{ steps.check.outputs.verdict }}\` |"
            echo "| 판정 사유 | ${{ steps.check.outputs.reason }} |"
            echo "| schema_version | \`${{ steps.check.outputs.schema }}\` |"
            echo "| generated_at_kst | \`${{ steps.check.outputs.gen_kst }}\` |"
            echo "| anchor_ok | \`${{ steps.check.outputs.anchor_ok }}\` |"
            echo "| 실행요청 결과 | \`${{ steps.dispatch.outputs.dispatched }}\` |"
            echo ""
            echo "- 판정 기준: 17 v1.12 RULE PUB-07 STEP 2 (a)(b)(c) 승계"
            echo "- \`OK\` = 당일 생성분 확보. CP-1 은 KST 09:30 이후 정상 진행."
            echo "- \`DISPATCH\` = 당일 생성분 미달. edt_snapshot.yml 즉시 실행요청."
            echo "  (dispatch 실행은 default branch 의 최신 워크플로 정의를 사용)"
            echo "- 재판정: 실행요청 후 Notion 스냅샷을 다시 확인하고,"
            echo "  그래도 미달이면 RULE PUB-07 3옵션을 CP-1 에서 상신한다."
          } >> "$GITHUB_STEP_SUMMARY"
