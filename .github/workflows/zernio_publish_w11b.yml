name: "🚀 Hero Shorts W11-B — ep88 Threads 단일 발행 (정기 · Zernio 1호출)"
# W11 후속 승인(2026-10-18) — ep88 을 Threads 에 정기 발행한다.
# youtube 는 W11 에서 published — plan_pending 이 재발행을 제외한다(멱등).
# 스테이징 불필요 — 원장 media_url 은 staged publicUrl(media.zernio.com, 발행 참조로 영구 보관 전환).
# Zernio 외부 호출 정확히 1회: POST /v1/posts
# 시크릿(계정 ID·API 키)은 어떤 출력에도 내보내지 않는다.
# 주의: --platforms 는 nargs="+" — 서브커맨드가 삼켜지지 않게 '=' 형태로 지정한다.
on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: "원장 release 태그"
        required: true
        default: "w11b-threads-ep88"
      ledger_name:
        description: "원장 자산 파일명"
        required: true
        default: "publish_state.json"
      ledger_sha256:
        description: "원장 sha256(입력본)"
        required: true
        default: "SET_AT_DISPATCH"
      ep:
        description: "회차 키"
        required: true
        default: "ep88"

permissions:
  contents: read

jobs:
  w11b-threads-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ledger and verify integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.asset_tag }}
          LEDGER: ${{ github.event.inputs.ledger_name }}
          LSHA: ${{ github.event.inputs.ledger_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$LEDGER" --output "$LEDGER"
          [ "$(sha256sum "$LEDGER" | awk '{print $1}')" = "$LSHA" ] || { echo LEDGER_SHA_MISMATCH; exit 63; }
          echo "LEDGER_VERIFIED sha=$LSHA"

      - name: Gate pre-assert (dry-run — 전송 0회)
        env:
          LEDGER: ${{ github.event.inputs.ledger_name }}
          EP: ${{ github.event.inputs.ep }}
        run: |
          set -euo pipefail
          python3 -m gen.hero_shorts.publish_targets.runner --ledger "$LEDGER" \
            --platforms=threads dry-run --eps "$EP" > dry.json
          python3 -c "import json; d=json.load(open('dry.json')); d=d[0] if isinstance(d, list) else d; assert d['pending'] == ['threads'], d; g=d['gates']['threads']; assert g['ok'] is True, g; print('GATE_OK pending=threads')"

      - name: "Publish ep88 → Threads 1회 + 원장 기록 — Zernio 1 call"
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          HERO_THREADS_ACCOUNT_ID: ${{ secrets.HERO_THREADS_ACCOUNT_ID }}
          LEDGER: ${{ github.event.inputs.ledger_name }}
          EP: ${{ github.event.inputs.ep }}
        run: |
          set -euo pipefail
          python3 -m gen.hero_shorts.publish_targets.runner --ledger "$LEDGER" \
            --platforms=threads publish --ep "$EP" --apply --write | tee publish_result.json

      - name: Upload updated ledger artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w11b-ledger
          path: ${{ github.event.inputs.ledger_name }}
          if-no-files-found: error
