name: "🎬 Hero Shorts Gen (v2.4.3 — gen 폴더)"
on:
  schedule:
    - cron: "0 1 * * 1,3"   # KST 월·수 10:00 발행 대비 plan 단계 — 0원 (생성 미포함)
  workflow_dispatch:          # 수동 실행 전용 — fal 실생성(현금)은 여기서만 발생
    inputs:
      step:
        description: "실행 단계 (plan|generate|assemble|qc|run)"
        required: true
        default: "plan"
      only:
        description: "생성할 컷 번호 (기본 2 = 단건). 전체 실행은 승인 후 HERO_ALLOW_ALL=1 별도 경로"
        required: false
        default: "2"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ffmpeg        # _validate_output 의 ffprobe 기술검증용 — 러너 미기본
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Run step
        run: |
          STEP="${{ github.event.inputs.step }}"
          ONLY="${{ github.event.inputs.only }}"
          echo "▶ STEP=$STEP ONLY=$ONLY (기본 2 — 단건 강제)"
          if [ "$STEP" = "generate" ]; then
            [ -f gen/data/out/ep86_plan.json ] || python3 -m gen.hero_shorts.pipeline plan   # plan 부재 시 노션 원장 직독 재생성(0원)
            ARGS="generate --plan gen/data/out/ep86_plan.json --backend fal"
            [ -n "$ONLY" ] && ARGS="$ARGS --only $ONLY"
            python3 -m gen.hero_shorts.pipeline $ARGS
          else
            python3 -m gen.hero_shorts.pipeline "${STEP:-plan}"
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}   # fal 시크릿 매핑
          FAL_ENDPOINT: minimax/h3/text-to-video   # fal 엔드포인트 — 공식 문서 확정
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}   # 노션 원장 직독(Actions) — 통합 토큰 시크릿
      - name: Upload artifacts (컷 영상·합본·QC·로그)   # v2.4.3 — 러너 소실 방지 필수
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-shorts-out
          path: |
            gen/data/out/
            gen/logs/
          if-no-files-found: ignore
