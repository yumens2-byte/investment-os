name: "🎬 Hero Shorts Gen (v2.8.2 — gen 폴더)"
on:
  schedule:
    - cron: "0 1 * * 2,4"   # KST 화·목 10:00 발행 대비 plan 단계 — 0원 (생성 미포함) — 9/23 마스터 지시: 월수→화목 변경
  workflow_dispatch:          # 수동 실행 전용 — fal 실생성(현금)은 여기서만 발생
    inputs:
      step:
        description: "실행 단계 (plan|generate|assemble|qc|run|publish_combined|preflight)"
        required: true
        default: "plan"
      only:
        description: "생성할 컷 번호 (기본 2 = 단건). 전체 실행은 승인 후 HERO_ALLOW_ALL=1 별도 경로"
        required: false
        default: "2"
      ep:
        description: "회차 태그 (publish_combined 시 필수, 예: ep86)"
        required: false
        default: ""
      title:
        description: "회차 제목 (publish_combined 시 필수 — 캡션 헤드)"
        required: false
        default: ""
      media_url:
        description: "발행할 합본 영상의 공개 URL (publish_combined 시 필수, gsk upload 결과)"
        required: false
        default: ""
      duration:
        description: "합본 영상 길이(초). 러너에 로컬 파일이 없을 때 필수 — 예: 60.86"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ffmpeg        # _validate_output 의 ffprobe 기술검증용 — 러너 미기본
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Run step
        run: |
          STEP="${{ github.event.inputs.step }}"
          ONLY="${{ github.event.inputs.only }}"
          EP="${{ github.event.inputs.ep }}"
          TITLE="${{ github.event.inputs.title }}"
          MEDIA_URL="${{ github.event.inputs.media_url }}"
          DURATION="${{ github.event.inputs.duration }}"
          echo "▶ STEP=$STEP ONLY=$ONLY EP=$EP"
          if [ "$STEP" = "generate" ]; then
            [ -f gen/data/out/ep86_plan.json ] || python3 -m gen.hero_shorts.pipeline plan   # plan 부재 시 노션 원장 직독 재생성(0원)
            ARGS=(generate --plan gen/data/out/ep86_plan.json --backend fal)
            if [ -n "$ONLY" ]; then
              ARGS+=(--only "$ONLY")
            fi
            python3 -m gen.hero_shorts.pipeline "${ARGS[@]}"
          elif [ "$STEP" = "preflight" ]; then
            # 2026-10-13 추가: 시크릿 HERO_TIKTOK_ACCOUNT_ID 실값 검증 — 0크레딧·발행 없음
            # 지문(sha256)만 출력 — 값 자체는 노출되지 않으며, 로컬 계산값과 대조한다.
            python3 -c "import hashlib,os;s=os.environ.get('HERO_TIKTOK_ACCOUNT_ID') or '';print('HERO_TIKTOK_ACCOUNT_ID sha256:', hashlib.sha256(s.encode()).hexdigest())"
            python3 -m gen.hero_shorts.tiktok.runner preflight
          elif [ "$STEP" = "publish_combined" ]; then
            # 2026-10-13 마스터 지시: 정기 발행은 3편 분할이 아니라 전편 합본 1편으로 올린다.
            # 60초 초과 무관 — 상한은 플랫폼 한도(TikTok/Zernio 3초~10분).
            if [ -z "$EP" ] || [ -z "$TITLE" ] || [ -z "$MEDIA_URL" ]; then
              echo "publish_combined: ep / title / media_url 3개 입력이 모두 필요합니다" >&2
              exit 64
            fi
            if [ -z "${HERO_TIKTOK_ACCOUNT_ID:-}" ]; then
              echo "HERO_TIKTOK_ACCOUNT_ID secret 미설정 — 틱톡 계정 ID를 등록하세요" >&2
              exit 65
            fi
            # Actions 러너에는 합본 mp4가 없다(gen/data 미추적·러너 초기화).
            # 로컬 파일이 있으면 ffprobe 실측, 없으면 --duration 입력으로 매니페스트 생성.
            CARGS=(combined --title "$TITLE" --media-url "$MEDIA_URL" --out gen/data/out/tiktok_combined.json)
            if [ -f "gen/data/out/${EP}_final.mp4" ]; then
              CARGS+=(--video "gen/data/out/${EP}_final.mp4")
            elif [ -n "$DURATION" ]; then
              CARGS+=(--duration "$DURATION")
            else
              echo "publish_combined: 로컬 합본 파일도 --duration 입력도 없음(둘 중 하나 필수)" >&2
              exit 66
            fi
            python3 -m gen.hero_shorts.tiktok.runner "${CARGS[@]}"
            python3 -m gen.hero_shorts.tiktok.runner publish \
              --manifest gen/data/out/tiktok_combined.json \
              --segment 1 --media-url "$MEDIA_URL"
          else
            python3 -m gen.hero_shorts.pipeline "${STEP:-plan}"
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}   # fal 시크릿 매핑
          FAL_ENDPOINT: minimax/h3/text-to-video   # fal 엔드포인트 — 공식 문서 확정
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}   # 표준 시크릿명(우선)
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}   # 과거 별칭 호환
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}   # 과거 레포 관례 호환
          HERO_TIKTOK_ACCOUNT_ID: ${{ secrets.HERO_TIKTOK_ACCOUNT_ID }}   # 틱톡 계정 _id
          HERO_TIKTOK_PRIVACY_LEVEL: "PUBLIC_TO_EVERYONE"
          HERO_TIKTOK_PREFLIGHT_WARN_HOURS: "12"   # 토큰 만료 임박 경보 임계(차단 아님)
      - name: Upload artifacts (컷 영상·합본·QC·로그)   # v2.4.3 — 러너 소실 방지 필수
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-shorts-out
          path: |
            gen/data/out/
            gen/logs/
          if-no-files-found: ignore
