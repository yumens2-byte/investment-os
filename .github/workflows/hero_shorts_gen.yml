name: "🎬 Hero Shorts Gen (v2.8.2 — gen 폴더)"
on:
  schedule:
    - cron: "0 1 * * 2,4"   # KST 화·목 10:00 발행 대비 plan 단계 — 0원 (생성 미포함) — 9/23 마스터 지시: 월수→화목 변경
  workflow_dispatch:          # 수동 실행 전용 — fal 실생성(현금)은 여기서만 발생
    inputs:
      step:
        description: "실행 단계 (plan|generate|assemble|qc|run|publish_youtube|preflight)"
        required: true
        default: "plan"
      only:
        description: "생성할 컷 번호 (기본 2 = 단건). 전체 실행은 승인 후 HERO_ALLOW_ALL=1 별도 경로"
        required: false
        default: "2"
      ep:
        description: "회차 태그 (publish_youtube 시 필수, 예: ep86)"
        required: false
        default: ""
      title:
        description: "회차 제목 (publish_youtube 시 필수 — 캡션 헤드)"
        required: false
        default: ""
      media_url:
        description: "발행할 합본 영상의 공개 URL (publish_youtube 시 필수, gsk upload 결과)"
        required: false
        default: ""
      duration:
        description: "합본 영상 길이(초). 러너에 로컬 파일이 없을 때 필수 — 예: 60.86"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ffmpeg        # _validate_output 의 ffprobe 기술검증용 — 러너 미기본
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Run step
        run: |
          STEP="${{ github.event.inputs.step }}"
          ONLY="${{ github.event.inputs.only }}"
          EP="${{ github.event.inputs.ep }}"
          TITLE="${{ github.event.inputs.title }}"
          MEDIA_URL="${{ github.event.inputs.media_url }}"
          DURATION="${{ github.event.inputs.duration }}"
          echo "▶ STEP=$STEP ONLY=$ONLY EP=$EP"
          if [ "$STEP" = "generate" ]; then
            [ -f gen/data/out/ep86_plan.json ] || python3 -m gen.hero_shorts.pipeline plan   # plan 부재 시 노션 원장 직독 재생성(0원)
            ARGS=(generate --plan gen/data/out/ep86_plan.json --backend fal)
            if [ -n "$ONLY" ]; then
              ARGS+=(--only "$ONLY")
            fi
            python3 -m gen.hero_shorts.pipeline "${ARGS[@]}"
          elif [ "$STEP" = "preflight" ]; then
            # Configuration check only: no account-health or publishing API call.
            python3 -c "from gen.hero_shorts.pipeline import _resolve_publish_opts; print('YouTube routing configured:', _resolve_publish_opts(platform='youtube')['account_id']); print('Connectivity is not checked')"
          elif [ "$STEP" = "publish_combined" ] || [ "$STEP" = "publish_youtube" ]; then
            # Existing combined action now targets YouTube; never use TikTok runner.
            EP="${EP#ep}"
            if [ -z "$EP" ] || [ -z "$MEDIA_URL" ]; then
              echo "YouTube 발행: ep / media_url 입력이 필요합니다" >&2
              exit 64
            fi
            # Fresh Actions runners do not contain production assets or approval state.
            # Fail closed; use an environment with restored assets and ledger.
            if [ ! -f "gen/data/out/ep${EP}_plan.json" ] || [ ! -f "gen/data/publish_state.json" ]; then
              echo "YouTube 발행 차단: 영상/plan/캡션/승인 원장을 복원한 운영 환경에서 gen/run_zernio_publish.sh를 실행하세요" >&2
              exit 66
            fi
            python3 -m gen.hero_shorts.pipeline zernio_publish --ep "$EP" \
              --platform youtube --media-url "$MEDIA_URL" --require-audible-audio
          else
            python3 -m gen.hero_shorts.pipeline "${STEP:-plan}"
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}   # fal 시크릿 매핑
          FAL_ENDPOINT: minimax/h3/text-to-video   # fal 엔드포인트 — 공식 문서 확정
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}   # 표준 시크릿명(우선)
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}   # 과거 별칭 호환
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}   # 과거 레포 관례 호환
          HERO_ZERNIO_PLATFORM: "youtube"
          HERO_YOUTUBE_ACCOUNT_ID: "6ad38f1d80b2fa2e1133f591"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
      - name: Upload artifacts (컷 영상·합본·QC·로그)   # v2.4.3 — 러너 소실 방지 필수
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-shorts-out
          path: |
            gen/data/out/
            gen/logs/
          if-no-files-found: ignore
