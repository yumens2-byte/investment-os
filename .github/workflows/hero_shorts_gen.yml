# workflow_run watchdog가 표시 이름을 정확히 일치시켜 구독하므로 이 이름은 안정적으로 유지한다.
name: "🎬 Hero Shorts Gen (v2.4.3 — gen 폴더)"
on:
  schedule:
    - cron: "0 1 * * 2,4"   # KST 화·목 10:00 발행 대비 plan 단계 — 0원 (생성 미포함)
  workflow_dispatch:          # fal 실생성(현금)은 수동 실행에서만 발생
    inputs:
      step:
        description: "실행 단계"
        required: true
        type: choice
        options: [plan, generate, run]
        default: "plan"
      episode:
        description: "에피소드 번호"
        required: true
        type: number
        default: 86
      only:
        description: "generate에서 생성할 단일 컷 번호"
        required: false
        type: number
        default: 2
      confirm_all:
        description: "run의 전체 컷 과금 실행을 승인합니다"
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ffmpeg        # _validate_output 의 ffprobe 기술검증용 — 러너 미기본
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Run step
        shell: bash
        run: |
          set -euo pipefail
          STEP="${{ inputs.step || 'plan' }}"
          EPISODE="${{ inputs.episode || 86 }}"
          ONLY="${{ inputs.only || 2 }}"
          PLAN="gen/data/out/ep${EPISODE}_plan.json"
          echo "▶ STEP=$STEP EPISODE=$EPISODE ONLY=$ONLY"

          case "$STEP" in
            plan)
              python3 -m gen.hero_shorts.pipeline plan --ep "$EPISODE"
              ;;
            generate)
              # Actions 러너는 매번 새 환경이다. 같은 실행에서 plan을 다시 만들어
              # 단일 컷 생성에 필요한 입력을 항상 보장한다.
              python3 -m gen.hero_shorts.pipeline plan --ep "$EPISODE"
              python3 -m gen.hero_shorts.pipeline generate \
                --plan "$PLAN" --backend fal --only "$ONLY"
              ;;
            run)
              if [ "${{ inputs.confirm_all || false }}" != "true" ]; then
                echo "::error::run은 1분 전체 컷을 과금 생성합니다. confirm_all을 선택하세요."
                exit 2
              fi
              # plan→전체 컷 생성→합본→QC를 한 러너에서 실행해야 컷 파일이 유실되지 않는다.
              HERO_ALLOW_ALL=1 python3 -m gen.hero_shorts.pipeline run \
                --ep "$EPISODE" --backend fal
              ;;
            *)
              echo "::error::지원하지 않는 단계: $STEP"
              exit 2
              ;;
          esac
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_AI_KEY: ${{ secrets.FAL_AI_KEY }}   # fal 시크릿 매핑
          FAL_ENDPOINT: fal-ai/minimax/hailuo-2.3/standard/text-to-video
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_API_KEY }}
      - name: Upload artifacts (컷 영상·합본·QC·로그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gen/data/out/
            gen/logs/
          if-no-files-found: ignore
          retention-days: 14
